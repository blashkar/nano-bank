apiVersion: apps/v1
kind: Deployment
metadata:
  name: cxo
  namespace: nano-bank
  labels: { app: cxo }
spec:
  replicas: 1
  selector: { matchLabels: { app: cxo } }
  template:
    metadata: { labels: { app: cxo } }
    spec:
      containers:
      - name: cxo
        image: nano-cxo:dev
        imagePullPolicy: Never
        ports: [ { containerPort: 8098 } ]
        envFrom:
        - secretRef: { name: nano-agent-secrets }   # provides OLLAMA_API_KEY
        env:
        - { name: CX_MCP_URL,         value: http://cx-mcp:8097/mcp }
        - { name: OLLAMA_BASE_URL,    value: https://ollama.com/v1 }
        - { name: CXO_MODEL,          value: kimi-k3 }
        - { name: CXO_MODEL_FALLBACK, value: kimi-k2.6 }
        - { name: API_PORT,           value: "8098" }
        - { name: QDRANT_URL,         value: http://agent-qdrant:6333 }
        - { name: MEMORY_NAMESPACE,   value: cxo }
        livenessProbe:
          httpGet: { path: /livez, port: 8098 }
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet: { path: /health, port: 8098 }
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cxo
  namespace: nano-bank
spec:
  selector: { app: cxo }
  ports: [ { port: 8098, targetPort: 8098 } ]
