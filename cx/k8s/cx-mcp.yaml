apiVersion: apps/v1
kind: Deployment
metadata:
  name: cx-mcp
  namespace: nano-bank
  labels: { app: cx-mcp }
spec:
  replicas: 1
  selector: { matchLabels: { app: cx-mcp } }
  template:
    metadata: { labels: { app: cx-mcp } }
    spec:
      containers:
      - name: mcp
        image: nano-cx:dev
        imagePullPolicy: Never
        ports: [ { containerPort: 8097 } ]
        env:
        - { name: DB_HOST,     value: postgres-service }
        - { name: DB_PORT,     value: "5432" }
        - { name: DB_NAME,     value: nano_bank_db }
        - { name: DB_USER,     value: nanobank_user }
        - { name: DB_PASSWORD, value: "secure_nano_password_2024!" }
        - { name: MCP_PORT,    value: "8097" }
---
apiVersion: v1
kind: Service
metadata:
  name: cx-mcp
  namespace: nano-bank
spec:
  selector: { app: cx-mcp }
  ports: [ { port: 8097, targetPort: 8097 } ]
